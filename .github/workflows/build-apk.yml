name: Build APK

# Runs on every push, and can also be started by hand from the Actions tab.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # GitHub's default shell is `bash -e`, which reports a pipeline's LAST exit status --
    # so `./gradlew ... | tee build.log` would report tee's success and let a failed build
    # carry on to the next step. pipefail is what makes the tee below safe.
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make the wrapper executable
        run: chmod +x gradlew

      # Room writes its schema JSON as a side effect of annotation processing, and
      # `room.schemaLocation` being a plain KSP argument means that directory is not a
      # declared task output. So when Gradle serves the KSP task from its build cache the
      # file is silently never written. Run the processor once with the cache disabled to
      # guarantee the schema exists; the main build below then reuses these outputs.
      - name: Generate the Room schemas
        run: ./gradlew :app:kspDebugKotlin --no-daemon --no-build-cache

      # A Room schema can only be regenerated from the exact source revision that produced
      # it, so commit each one as soon as it exists — after the next version bump the
      # previous schema is unreconstructable, and with it the ability to test that migration.
      - name: Commit the generated Room schemas
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain app/schemas)" ]; then
            echo "Room schemas unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/schemas
          git commit -qm "chore: record Room schema generated from ${GITHUB_SHA}"
          git push -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"

      # The migration and calorie tests are the only automated coverage, so a failure
      # here stops the APK from being published rather than being reported alongside it.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon 2>&1 | tee build.log

      - name: Build
        run: ./gradlew assembleDebug assembleRelease --no-daemon 2>&1 | tee -a build.log

      # Gradle prints compiler diagnostics thousands of lines above its own stack trace,
      # so on failure they are off the end of anything but a full log download. Repeat
      # them last, where `tail` will find them.
      - name: Repeat the compiler errors
        if: failure()
        run: |
          strip() { sed 's#file:///home/runner/work/stride-fitness/stride-fitness/##'; }
          echo "----- diagnostics -----"
          grep -E "^(e|w): |error:|FAILED|Tests? .*failed|^[[:space:]]+[A-Za-z]+Test > " \
            build.log | strip | tail -n 60 || echo "(no diagnostic lines matched)"
          # KSP and Gradle can fail without emitting a `e:` line at all, so the raw tail
          # goes out too rather than leaving the log looking empty.
          echo "----- last 40 lines -----"
          tail -n 40 build.log | strip || true
          echo "----- failing test reports -----"
          for f in app/build/reports/tests/*/index.html; do
            [ -e "$f" ] && echo "$f"
          done
          find app/build/test-results -name '*.xml' -print0 2>/dev/null \
            | xargs -0 grep -l "<failure" 2>/dev/null \
            | while read -r xml; do
                echo "--- $xml"
                grep -oE 'message="[^"]*"' "$xml" | head -n 5
              done || true

      - name: Rename the APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/stride-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/stride.apk
          ls -la out

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: stride-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      # The APKs are also published to a standalone `apk-build` branch so they
      # can be fetched over plain git, without the Actions artifact API.
      - name: Publish the APKs to the apk-build branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          work=$(mktemp -d)
          cp out/stride.apk out/stride-debug.apk "$work"/
          cd "$work"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -qb apk-build
          git add -A
          git commit -qm "Stride APKs built from ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-build
